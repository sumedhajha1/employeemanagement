# ==============================================================================
# Spring Boot Application Configuration
# ==============================================================================
spring.application.name=employee-management-api

# Server Configuration
server.port=8080

# ==============================================================================
# PostgreSQL Database Configuration
# Environment variables DB_URL, DB_USERNAME, DB_PASSWORD can override defaults
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/employeedb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
# JPA / Hibernate Configuration
# ddl-auto: 'update' automatically updates DB schema based on entity definitions
# In production, use 'validate' or database migration tools like Flyway / Liquibase.
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==============================================================================
# Springdoc OpenAPI & Swagger UI Configuration
# ==============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ==============================================================================
# Actuator Configuration
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
