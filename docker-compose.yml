version: '3.8'

services:
  # ==============================================================================
  # PostgreSQL Database Service
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: employee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-employeedb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-employeedb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - employee-net

  # ==============================================================================
  # Spring Boot REST API Service
  # ==============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employee-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-employeedb}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - employee-net

volumes:
  postgres_data:
    driver: local

networks:
  employee-net:
    driver: bridge
